<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project — Arshad</title>
<meta name="description" content="Case study by Arshad, motion designer and creative director.">
<meta name="theme-color" content="#f4f3ed">
<meta property="og:title" content="Project — Arshad">
<meta property="og:description" content="Case study by Arshad, motion designer and creative director.">
<meta property="og:image" content="https://arshadar.github.io/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/main.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body data-page="project">
<div class="world" aria-hidden="true"></div>
<main>

  <section class="pj__hero wrap" data-hud="Project">
    <div class="ph__top mono"><a href="work.html" class="ul label" data-cur="link">← All work</a><span class="muted js-pj-idx"></span></div>
    <p class="mono blue js-pj-disc" data-scramble></p>
    <h1 class="d1 js-pj-brand" style="margin-top:18px"></h1>
    <p class="d3 muted js-pj-title" style="margin-top:14px"></p>
    <div class="pj__meta js-pj-meta"></div>
    <div class="player js-player" data-cur="bub" data-cur-label="Play">
      <video playsinline preload="metadata"></video>
      <div class="player__big"><span>Play ▶</span></div>
      <div class="player__ui">
        <button class="player__btn js-pp" aria-label="Play or pause" data-cur="link">▶</button>
        <div class="player__bar js-seek"><i></i></div>
        <span class="player__t js-pt">0:00 / 0:00</span>
        <button class="player__btn js-mute" aria-label="Mute" data-cur="link" style="width:40px;height:40px;font-size:13px">🔊</button>
        <button class="player__btn js-fs" aria-label="Fullscreen" data-cur="link" style="width:40px;height:40px;font-size:13px">⤢</button>
      </div>
    </div>
  </section>
  <section class="sec wrap" data-hud="Story">
    <div class="pj__body">
      <p class="label mono" data-scramble>(01) The work</p>
      <div><p class="d4 js-pj-desc" data-fade></p><p class="lead muted js-pj-how" style="margin-top:28px" data-fade></p></div>
    </div>
  </section>
  <section class="wrap" data-hud="Frames"><div class="pj__stills js-stills"></div></section>
  <section class="sec wrap" data-hud="Next step">
    <div class="pj__body">
      <p class="label mono" data-scramble>(02) Your turn</p>
      <div>
        <h2 class="d2" data-split>Want something like this for your brand?</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:36px">
          <a class="btn btn--blue js-pj-wa" data-mag data-cur="link"><span class="roll">Ask about a similar project</span><span class="btn__ic"></span></a>
          <a class="btn btn--line" href="contact.html" data-mag data-cur="link"><span class="roll">Send a brief</span><span class="btn__ic"></span></a>
        </div>
      </div>
    </div>
    <div style="margin-top:clamp(80px,10vw,140px)">
      <div class="sel__head"><p class="label mono" data-scramble>(03) More like this</p><a href="work.html" class="ul mono" data-cur="link">View all work →</a></div>
      <div class="agrid js-more" style="grid-template-columns:repeat(3,1fr)"></div>
    </div>
  </section>
  <section class="sec wrap" style="padding-top:0" data-hud="Next">
    <a class="next js-next" data-cur="bub" data-cur-label="Next">
      <p class="label mono">Next project</p>
      <div class="next__in" style="margin-top:24px">
        <div><h2 class="d1 js-next-b"></h2><p class="d4 muted js-next-t" style="margin-top:12px"></p></div>
        <div class="next__m"><img class="js-next-img" alt=""></div>
      </div>
    </a>
  </section>
</main>
<script src="js/data.js"></script>
<script src="vendor/gsap.min.js" defer></script>
<script src="vendor/ScrollTrigger.min.js" defer></script>
<script src="vendor/lenis.min.js" defer></script>
<script type="module" src="js/page.js"></script>
</body>
</html>
